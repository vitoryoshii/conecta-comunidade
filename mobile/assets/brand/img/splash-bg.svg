  <circle cx="560" cy="300" r="6" fill="#8FE3AE" opacity="0.85"/>
  <circle cx="650" cy="450" r="7" fill="#8FE3AE" opacity="0.85"/>
  <circle cx="290" cy="560" r="6" fill="#8FE3AE" opacity="0.85"/>
  <circle cx="500" cy="580" r="8" fill="#FFD470" opacity="0.9"/>

