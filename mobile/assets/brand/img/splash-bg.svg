<svg width="800" height="1200" viewBox="0 0 800 1200" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sBg" x1="0" y1="0" x2="700" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1BAE86"/>
      <stop offset="0.5" stop-color="#159463"/>
      <stop offset="1" stop-color="#0C5E3B"/>
    </linearGradient>
    <radialGradient id="sTeal" cx="0.15" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#2FD3C0" stop-opacity="0.55"/><stop offset="1" stop-color="#2FD3C0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sAmber" cx="0.9" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#F5A623" stop-opacity="0.30"/><stop offset="1" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sCity" x1="0" y1="900" x2="0" y2="1200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B5236"/><stop offset="1" stop-color="#083B27"/>
