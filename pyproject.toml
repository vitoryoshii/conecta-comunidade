[project]
name = "conecta-comunidade"
version = "1.0.0"
description = "Aplicativo que conecta pessoas, doadores, voluntários e ONGs."
readme = "README.md"
requires-python = ">=3.12,<3.15"
# O manifesto da raiz é resolvido pelo serviço FastAPI na Vercel. As
# dependências exclusivas do APK são geradas no staging por
# scripts/prepare_mobile_distribution.py.
dependencies = [
    "fastapi==0.141.1",
    "sqlmodel==0.0.42",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "python-dotenv==1.2.3",
    "python-jose[cryptography]==3.5.0",
    "passlib==1.7.4",
    "bcrypt==4.0.1",
    "geopy==2.5.0",
    "psycopg2-binary==2.9.11",
    "flet==0.86.5",
    "httpx==0.28.1",
]

[tool.flet]
product = "Conecta Comunidade"
bundle_id = "br.edu.conectacomunidade.app"
company = "VyteTech Solutions LTDA"
icon = "mobile/assets/brand/logo/app-icon-512.png"
splash_color = "#F5F7F6"
splash_dark_color = "#0E2A47"

[tool.flet.app]
# O staging é gerado por scripts/prepare_mobile_distribution.py a partir de uma
# allowlist. Isso impede que arquivos locais do repositório alcancem o APK.
path = "build/distribution-app"
module = "main"
exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "__pycache__",
    ".env",
    ".env.*",
    "alembic",
    "backend",
    "docs",
    "tests",
    "README.md",
    "PLAN.md",
    "pytest.ini",
    "requirements.txt",
    "requirements-backend.txt",
    "requirements-dev.txt",
    "requirements-mobile.txt",
    "vercel.json",
    "alembic.ini",
    "seed.py",
    "conecta.db",
    "*.db",
    "*.sqlite",
    "*.sqlite3",
    "*.pem",
    "*.key",
    "*.p12",
    "*.pfx",
    "*.jks",
    ".coverage",
    "htmlcov",
    "mobile/assets/avatars",
]

[tool.flet.android.permission]
"android.permission.INTERNET" = true
