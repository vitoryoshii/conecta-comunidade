[project]
name = "conecta-comunidade"
version = "1.0.0"
description = "Aplicativo que conecta pessoas, doadores, voluntários e ONGs."
readme = "README.md"
requires-python = ">=3.12,<3.15"
# O manifesto da raiz é resolvido pelo serviço FastAPI na Vercel. As
# dependências exclusivas do APK são geradas no staging por
# scripts/prepare_mobile_distribution.py.
dependencies = [
    "fastapi==0.141.1",
    "sqlmodel==0.0.42",
    "pydantic-settings==2.15.0",
    "email-validator==2.3.0",
    "python-dotenv==1.2.3",
    "python-jose[cryptography]==3.5.0",
    "passlib==1.7.4",
    "bcrypt==4.0.1",
    "geopy==2.5.0",
    "psycopg2-binary==2.9.11",
    "flet==0.86.5",
    "httpx==0.28.1",
]

[tool.flet]
product = "Conecta Comunidade"
bundle_id = "br.edu.conectacomunidade.app"
company = "VyteTech Solutions LTDA"
icon = "mobile/assets/brand/logo/app-icon-512.png"
splash_color = "#F5F7F6"
splash_dark_color = "#0E2A47"

[tool.flet.app]
# O app é empacotado pela raiz do repositório para preservar `mobile/` como
# pacote Python e permitir os imports absolutos `from mobile ...` no Android.
path = "."
module = "main"
exclude = [
    ".git",
    ".pytest_cache",
    ".venv",
    "__pycache__",
    "alembic",
    "backend",
    "docs",
    "tests",
    ".env.example",
    "seed.py",
    "conecta.db",
]

[tool.flet.android.permission]
"android.permission.INTERNET" = true
